<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif">
<rect width="1180" height="520" fill="#fcfcfb"/>
<text x="24" y="34" font-size="20" font-weight="700" fill="#1a1a19">One look at the guest screen: what it costs, before and after</text>
<text x="24" y="52" font-size="12.5" fill="#5c5b55">AppleBridge screenshot path, daemon 0.8d45 → 0.8d47. Same script, same machine; every value is a median of the runs in host/bench/results and docs/SCREENSHOT_V2.md.</text>
<text x="24" y="70" font-size="15" font-weight="600" fill="#1a1a19">Seconds per look (control port, end to end)</text>
<text x="24" y="90" font-size="12" fill="#5c5b55">log scale · measured 2026-08-30, Basilisk II, System 7.6.1, ether slirp, 1024×768×8</text>
<line x1="274.0" y1="100" x2="274.0" y2="436" stroke="#e6e5df" stroke-width="1"/>
<text x="274.0" y="452" font-size="11" fill="#5c5b55" text-anchor="middle">10 ms</text>
<line x1="370.7" y1="100" x2="370.7" y2="436" stroke="#e6e5df" stroke-width="1"/>
<text x="370.7" y="452" font-size="11" fill="#5c5b55" text-anchor="middle">100 ms</text>
<line x1="467.3" y1="100" x2="467.3" y2="436" stroke="#e6e5df" stroke-width="1"/>
<text x="467.3" y="452" font-size="11" fill="#5c5b55" text-anchor="middle">1 s</text>
<line x1="564.0" y1="100" x2="564.0" y2="436" stroke="#e6e5df" stroke-width="1"/>
<text x="564.0" y="452" font-size="11" fill="#5c5b55" text-anchor="middle">10 s</text>
<text x="264" y="125" font-size="12.5" fill="#1a1a19" text-anchor="end">raw pixmap (before)</text>
<rect x="274" y="110" width="255.5" height="22" rx="0" fill="#2a78d6"/>
<rect x="525.5" y="110" width="4" height="22" rx="2" fill="#2a78d6"/>
<text x="537.5" y="125" font-size="12" fill="#1a1a19">4.4 s</text>
<text x="264" y="173" font-size="12.5" fill="#1a1a19" text-anchor="end">PackBits, round 1 (enc 1)</text>
<rect x="274" y="158" width="235.0" height="22" rx="0" fill="#2a78d6"/>
<rect x="505.0" y="158" width="4" height="22" rx="2" fill="#2a78d6"/>
<text x="517.0" y="173" font-size="12" fill="#1a1a19">2.7 s</text>
<text x="264" y="221" font-size="12.5" fill="#1a1a19" text-anchor="end">Up + PackBits, first look (enc 3)</text>
<rect x="274" y="206" width="159.8" height="22" rx="0" fill="#2a78d6"/>
<rect x="429.8" y="206" width="4" height="22" rx="2" fill="#2a78d6"/>
<text x="441.8" y="221" font-size="12" fill="#1a1a19">450 ms</text>
<text x="264" y="269" font-size="12.5" fill="#1a1a19" text-anchor="end">region 400x300 (enc 3)</text>
<rect x="274" y="254" width="75.2" height="22" rx="0" fill="#2a78d6"/>
<rect x="345.2" y="254" width="4" height="22" rx="2" fill="#2a78d6"/>
<text x="357.2" y="269" font-size="12" fill="#1a1a19">60 ms</text>
<text x="264" y="317" font-size="12.5" fill="#1a1a19" text-anchor="end">repeat look, XOR delta (enc 2)</text>
<rect x="274" y="302" width="110.8" height="22" rx="0" fill="#2a78d6"/>
<rect x="380.8" y="302" width="4" height="22" rx="2" fill="#2a78d6"/>
<text x="392.8" y="317" font-size="12" fill="#1a1a19">140 ms</text>
<text x="264" y="365" font-size="12.5" fill="#1a1a19" text-anchor="end">repeat look, nothing changed</text>
<rect x="274" y="350" width="107.7" height="22" rx="0" fill="#2a78d6"/>
<rect x="377.7" y="350" width="4" height="22" rx="2" fill="#2a78d6"/>
<text x="389.7" y="365" font-size="12" fill="#1a1a19">130 ms</text>
<text x="264" y="413" font-size="12.5" fill="#1a1a19" text-anchor="end">host-side export (spike, local only)</text>
<rect x="274" y="398" width="22.3" height="22" rx="0" fill="#2a78d6"/>
<rect x="292.3" y="398" width="4" height="22" rx="2" fill="#2a78d6"/>
<text x="304.3" y="413" font-size="12" fill="#1a1a19">17 ms</text>
<text x="600" y="70" font-size="15" font-weight="600" fill="#1a1a19">Bytes on the guest→host bridge per look</text>
<text x="600" y="90" font-size="12" fill="#5c5b55">log scale · measured 2026-08-30, Basilisk II, System 7.6.1, ether slirp, 1024×768×8</text>
<line x1="850.0" y1="100" x2="850.0" y2="436" stroke="#e6e5df" stroke-width="1"/>
<text x="850.0" y="452" font-size="11" fill="#5c5b55" text-anchor="middle">100 B</text>
<line x1="922.5" y1="100" x2="922.5" y2="436" stroke="#e6e5df" stroke-width="1"/>
<text x="922.5" y="452" font-size="11" fill="#5c5b55" text-anchor="middle">1 KB</text>
<line x1="995.0" y1="100" x2="995.0" y2="436" stroke="#e6e5df" stroke-width="1"/>
<text x="995.0" y="452" font-size="11" fill="#5c5b55" text-anchor="middle">10 KB</text>
<line x1="1067.5" y1="100" x2="1067.5" y2="436" stroke="#e6e5df" stroke-width="1"/>
<text x="1067.5" y="452" font-size="11" fill="#5c5b55" text-anchor="middle">100 KB</text>
<line x1="1140.0" y1="100" x2="1140.0" y2="436" stroke="#e6e5df" stroke-width="1"/>
<text x="1140.0" y="452" font-size="11" fill="#5c5b55" text-anchor="middle">1 MB</text>
<text x="840" y="125" font-size="12.5" fill="#1a1a19" text-anchor="end">raw pixmap (before)</text>
<rect x="850" y="110" width="282.5" height="22" rx="0" fill="#2a78d6"/>
<rect x="1128.5" y="110" width="4" height="22" rx="2" fill="#2a78d6"/>
<text x="1140.5" y="125" font-size="12" fill="#1a1a19">787 KB</text>
<text x="840" y="173" font-size="12.5" fill="#1a1a19" text-anchor="end">PackBits, round 1 (enc 1)</text>
<rect x="850" y="158" width="272.7" height="22" rx="0" fill="#2a78d6"/>
<rect x="1118.7" y="158" width="4" height="22" rx="2" fill="#2a78d6"/>
<text x="1130.7" y="173" font-size="12" fill="#1a1a19">578 KB</text>
<text x="840" y="221" font-size="12.5" fill="#1a1a19" text-anchor="end">Up + PackBits, first look (enc 3)</text>
<rect x="850" y="206" width="193.7" height="22" rx="0" fill="#2a78d6"/>
<rect x="1039.7" y="206" width="4" height="22" rx="2" fill="#2a78d6"/>
<text x="1051.7" y="221" font-size="12" fill="#1a1a19">47 KB</text>
<text x="840" y="269" font-size="12.5" fill="#1a1a19" text-anchor="end">region 400x300 (enc 3)</text>
<rect x="850" y="254" width="122.5" height="22" rx="0" fill="#2a78d6"/>
<rect x="968.5" y="254" width="4" height="22" rx="2" fill="#2a78d6"/>
<text x="980.5" y="269" font-size="12" fill="#1a1a19">5 KB</text>
<text x="840" y="317" font-size="12.5" fill="#1a1a19" text-anchor="end">repeat look, XOR delta (enc 2)</text>
<rect x="850" y="302" width="104.9" height="22" rx="0" fill="#2a78d6"/>
<rect x="950.9" y="302" width="4" height="22" rx="2" fill="#2a78d6"/>
<text x="962.9" y="317" font-size="12" fill="#1a1a19">3 KB</text>
<text x="840" y="365" font-size="12.5" fill="#1a1a19" text-anchor="end">repeat look, nothing changed</text>
<rect x="850" y="350" width="66.1" height="22" rx="0" fill="#2a78d6"/>
<rect x="912.1" y="350" width="4" height="22" rx="2" fill="#2a78d6"/>
<text x="924.1" y="365" font-size="12" fill="#1a1a19">815 B</text>
<text x="840" y="413" font-size="12.5" fill="#1a1a19" text-anchor="end">host-side export (spike, local only)</text>
<text x="856" y="413" font-size="12" fill="#5c5b55">0 B — no bridge traffic</text>
<text x="24" y="506" font-size="11" fill="#5c5b55">Repeat looks are the loop an agent actually runs (look → act → look). The host-side export is a Basilisk II patch measured for comparison; it ships for none of the three targets (D-025).</text>
</svg>